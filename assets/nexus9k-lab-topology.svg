<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#111827}.title{font-size:34px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px}.box{stroke:#1f2937;stroke-width:2;rx:14}.spine{fill:#dbeafe}.leaf{fill:#dcfce7}.server{fill:#fce7f3}.wan{fill:#ede9fe}.note{fill:#fef3c7}.underlay{stroke:#2563eb;stroke-width:4}.vpc{stroke:#dc2626;stroke-width:6}.access{stroke:#db2777;stroke-width:4}.l3{stroke:#7c3aed;stroke-width:4}
</style>
</defs>
<rect width="1500" height="920" fill="white"/>
<text x="55" y="55" class="title">Nexus 9000 NX-OS Lab Topology</text>
<text x="55" y="88" class="s">L2/L3, vPC and VXLAN EVPN concepts in one reference topology</text>

<rect x="300" y="150" width="320" height="100" class="box spine"/>
<text x="460" y="190" text-anchor="middle" class="h">Spine-1 / EVPN RR</text>
<text x="460" y="220" text-anchor="middle" class="s">Underlay + BGP EVPN</text>

<rect x="880" y="150" width="320" height="100" class="box spine"/>
<text x="1040" y="190" text-anchor="middle" class="h">Spine-2 / EVPN RR</text>
<text x="1040" y="220" text-anchor="middle" class="s">Underlay + BGP EVPN</text>

<rect x="180" y="390" width="360" height="130" class="box leaf"/>
<text x="360" y="430" text-anchor="middle" class="h">N9K-1 / Leaf-1</text>
<text x="360" y="462" text-anchor="middle" class="s">VLAN / SVI / VRF / vPC / VTEP</text>
<text x="360" y="492" text-anchor="middle" class="s">Loopback VTEP 10.255.1.11</text>

<rect x="960" y="390" width="360" height="130" class="box leaf"/>
<text x="1140" y="430" text-anchor="middle" class="h">N9K-2 / Leaf-2</text>
<text x="1140" y="462" text-anchor="middle" class="s">VLAN / SVI / VRF / vPC / VTEP</text>
<text x="1140" y="492" text-anchor="middle" class="s">Loopback VTEP 10.255.1.12</text>

<line x1="360" y1="390" x2="460" y2="250" class="underlay"/>
<line x1="360" y1="390" x2="1040" y2="250" class="underlay"/>
<line x1="1140" y1="390" x2="460" y2="250" class="underlay"/>
<line x1="1140" y1="390" x2="1040" y2="250" class="underlay"/>
<text x="750" y="330" text-anchor="middle" class="s">L3 Underlay: OSPF / IS-IS / eBGP + ECMP</text>

<line x1="540" y1="455" x2="960" y2="455" class="vpc"/>
<text x="750" y="440" text-anchor="middle" class="h">vPC Peer-Link (Standalone NX-OS example)</text>

<rect x="520" y="650" width="460" height="130" class="box server"/>
<text x="750" y="690" text-anchor="middle" class="h">Dual-Homed Server</text>
<text x="750" y="722" text-anchor="middle" class="s">LACP Port-Channel / vPC 10</text>
<text x="750" y="752" text-anchor="middle" class="s">VLAN 110 WEB / VLAN 120 APP</text>

<line x1="360" y1="520" x2="650" y2="650" class="access"/>
<line x1="1140" y1="520" x2="850" y2="650" class="access"/>

<rect x="60" y="650" width="300" height="120" class="box wan"/>
<text x="210" y="693" text-anchor="middle" class="h">Core / WAN Router</text>
<text x="210" y="725" text-anchor="middle" class="s">OSPF / BGP Routed Link</text>
<line x1="250" y1="650" x2="300" y2="520" class="l3"/>

<rect x="1110" y="650" width="330" height="120" class="box note"/>
<text x="1275" y="690" text-anchor="middle" class="h">VXLAN EVPN</text>
<text x="1275" y="722" text-anchor="middle" class="s">L2 VNI / L3 VNI / NVE</text>
<text x="1275" y="750" text-anchor="middle" class="s">BGP EVPN = overlay control plane</text>

<text x="55" y="850" class="s">Blue: routed underlay | Red: NX-OS vPC peer-link | Pink: server access | Purple: external L3</text>
</svg>
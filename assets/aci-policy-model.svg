<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><style>
text{font-family:Arial,sans-serif;fill:#111827}.title{font-size:34px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px}.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.blue{fill:#dbeafe}.green{fill:#dcfce7}.yellow{fill:#fef3c7}.pink{fill:#fce7f3}.purple{fill:#ede9fe}.line{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1500" height="900" fill="white"/>
<text x="60" y="55" class="title">Cisco ACI Policy Model</text>

<rect x="600" y="100" width="300" height="80" class="box yellow"/><text x="750" y="148" text-anchor="middle" class="h">Tenant: LAB</text>
<rect x="160" y="250" width="300" height="80" class="box blue"/><text x="310" y="298" text-anchor="middle" class="h">VRF: VRF-LAB</text>
<rect x="600" y="250" width="300" height="80" class="box purple"/><text x="750" y="298" text-anchor="middle" class="h">App Profile: APP-LAB</text>
<rect x="1040" y="250" width="300" height="80" class="box blue"/><text x="1190" y="298" text-anchor="middle" class="h">L3Out: L3OUT-OSPF</text>

<rect x="90" y="430" width="300" height="90" class="box green"/><text x="240" y="468" text-anchor="middle" class="h">BD-WEB</text><text x="240" y="497" text-anchor="middle" class="s">10.10.10.1/24</text>
<rect x="430" y="430" width="300" height="90" class="box green"/><text x="580" y="468" text-anchor="middle" class="h">BD-APP</text><text x="580" y="497" text-anchor="middle" class="s">10.10.20.1/24</text>
<rect x="770" y="430" width="300" height="90" class="box pink"/><text x="920" y="468" text-anchor="middle" class="h">EPG-WEB</text><text x="920" y="497" text-anchor="middle" class="s">Consumer</text>
<rect x="1110" y="430" width="300" height="90" class="box pink"/><text x="1260" y="468" text-anchor="middle" class="h">EPG-APP</text><text x="1260" y="497" text-anchor="middle" class="s">Provider</text>

<rect x="770" y="650" width="640" height="100" class="box yellow"/><text x="1090" y="690" text-anchor="middle" class="h">Contract CT-WEB-APP</text><text x="1090" y="720" text-anchor="middle" class="s">Subject → Filter TCP dst 8443 → zoning rule/filter on Leaf</text>
<rect x="1040" y="790" width="300" height="75" class="box purple"/><text x="1190" y="836" text-anchor="middle" class="h">External EPG</text>

<line x1="750" y1="180" x2="310" y2="250" class="line"/>
<line x1="750" y1="180" x2="750" y2="250" class="line"/>
<line x1="750" y1="180" x2="1190" y2="250" class="line"/>
<line x1="310" y1="330" x2="240" y2="430" class="line"/>
<line x1="310" y1="330" x2="580" y2="430" class="line"/>
<line x1="750" y1="330" x2="920" y2="430" class="line"/>
<line x1="750" y1="330" x2="1260" y2="430" class="line"/>
<line x1="920" y1="520" x2="980" y2="650" class="line"/>
<line x1="1260" y1="520" x2="1200" y2="650" class="line"/>
<line x1="1190" y1="330" x2="1190" y2="790" class="line"/>
<text x="150" y="590" class="s">VRF = routing scope</text>
<text x="150" y="620" class="s">BD = L2 forwarding domain</text>
<text x="150" y="650" class="s">EPG = policy identity</text>
<text x="150" y="680" class="s">Contract = allowed service relationship</text>
</svg>
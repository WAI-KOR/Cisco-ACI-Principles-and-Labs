<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#111827}.title{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:16px}.box{stroke:#1f2937;stroke-width:2;rx:14}.spine{fill:#dbeafe}.leaf{fill:#dcfce7}.apic{fill:#fef3c7}.ep{fill:#fce7f3}.router{fill:#ede9fe}.fabric{stroke:#334155;stroke-width:4}.ctrl{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8}.access{stroke:#db2777;stroke-width:4}.l3{stroke:#7c3aed;stroke-width:4}
</style>
</defs>
<rect width="1500" height="900" fill="white"/>
<text x="60" y="55" class="title">Cisco ACI Principle Lab Topology</text>
<text x="60" y="88" class="s">APIC controls policy; endpoint data traffic traverses Leaf - Spine - Leaf.</text>

<rect x="470" y="115" width="560" height="120" class="box apic"/>
<text x="750" y="150" text-anchor="middle" class="h">APIC Cluster</text>
<text x="750" y="180" text-anchor="middle" class="s">APIC-1 / APIC-2 / APIC-3</text>
<text x="750" y="208" text-anchor="middle" class="s">Policy, MIT, REST API, Fabric Management</text>

<rect x="330" y="310" width="300" height="100" class="box spine"/>
<text x="480" y="350" text-anchor="middle" class="h">Spine-101</text>
<text x="480" y="382" text-anchor="middle" class="s">COOP DB / MP-BGP RR</text>
<rect x="870" y="310" width="300" height="100" class="box spine"/>
<text x="1020" y="350" text-anchor="middle" class="h">Spine-102</text>
<text x="1020" y="382" text-anchor="middle" class="s">COOP DB / MP-BGP RR</text>

<rect x="190" y="520" width="360" height="120" class="box leaf"/>
<text x="370" y="558" text-anchor="middle" class="h">Leaf-201 / Border Leaf</text>
<text x="370" y="590" text-anchor="middle" class="s">EPG classify / Distributed GW / Policy CAM</text>
<text x="370" y="618" text-anchor="middle" class="s">L3Out capable</text>

<rect x="950" y="520" width="360" height="120" class="box leaf"/>
<text x="1130" y="558" text-anchor="middle" class="h">Leaf-202 / Border Leaf</text>
<text x="1130" y="590" text-anchor="middle" class="s">EPG classify / Distributed GW / Policy CAM</text>
<text x="1130" y="618" text-anchor="middle" class="s">L3Out capable</text>

<line x1="370" y1="520" x2="480" y2="410" class="fabric"/>
<line x1="370" y1="520" x2="1020" y2="410" class="fabric"/>
<line x1="1130" y1="520" x2="480" y2="410" class="fabric"/>
<line x1="1130" y1="520" x2="1020" y2="410" class="fabric"/>
<text x="750" y="470" text-anchor="middle" class="s">Fabric: IS-IS underlay + VXLAN overlay + ECMP</text>

<line x1="650" y1="235" x2="480" y2="310" class="ctrl"/>
<line x1="850" y1="235" x2="1020" y2="310" class="ctrl"/>
<text x="750" y="275" text-anchor="middle" class="s">management / policy control</text>

<rect x="80" y="730" width="360" height="110" class="box ep"/>
<text x="260" y="767" text-anchor="middle" class="h">WEB Server</text>
<text x="260" y="797" text-anchor="middle" class="s">10.10.10.10 / EPG-WEB / VLAN 110</text>
<text x="260" y="824" text-anchor="middle" class="s">GW 10.10.10.1</text>
<line x1="260" y1="730" x2="340" y2="640" class="access"/>

<rect x="1060" y="730" width="360" height="110" class="box ep"/>
<text x="1240" y="767" text-anchor="middle" class="h">APP Server</text>
<text x="1240" y="797" text-anchor="middle" class="s">10.10.20.10 / EPG-APP / VLAN 120</text>
<text x="1240" y="824" text-anchor="middle" class="s">GW 10.10.20.1</text>
<line x1="1240" y1="730" x2="1160" y2="640" class="access"/>

<rect x="600" y="735" width="300" height="100" class="box router"/>
<text x="750" y="772" text-anchor="middle" class="h">External Router</text>
<text x="750" y="802" text-anchor="middle" class="s">OSPF Area 0 / L3OUT-OSPF</text>
<line x1="550" y1="610" x2="650" y2="735" class="l3"/>
<line x1="950" y1="610" x2="850" y2="735" class="l3"/>
</svg>